version: "3.9"

services:
  api:
    build: ./API
    container_name: gpu-api
    restart: always
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: gpu-db
    restart: always
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    container_name: gpu-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: always

  scheduler:
    build:
      context: ./data
      dockerfile: pipeline/Dockerfile
    container_name: gpu-scheduler
    restart: always
    env_file:
      - .env
    depends_on:
      - db
      - flaresolverr
    volumes:
      - ./logs:/app/logs

volumes:
  pgdata: